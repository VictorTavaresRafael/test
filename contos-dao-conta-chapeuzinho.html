<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFC857">
<title>Chapeuzinho Vermelho — Os Contos Dão Conta</title>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@600;700;800&amp;display=swap" rel="stylesheet">
<style>
:root{--ink:#2B2540;--muted:#5A5470;--paper:#FFF8E6;--card:#FFFDF7;--gold:#FFC857;--gold-deep:#E9A93A;--line:#EBD08A;--hood:#C9362B;--hood-deep:#8F2119;--leaf:#2F7A48;--leaf-deep:#1F5C3B;--sky:#BDE8F5}
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:#FFF2CC;color:var(--ink);font-family:'Nunito',system-ui,-apple-system,'Segoe UI',sans-serif}
h1,h2,h3,.disp{font-family:'Fredoka','Nunito',system-ui,sans-serif;margin:0;font-weight:600;letter-spacing:.2px}
p{margin:0}
[hidden]{display:none!important}
button{font-family:'Fredoka','Nunito',system-ui,sans-serif;cursor:pointer;-webkit-tap-highlight-color:transparent}
button:focus-visible,input:focus-visible,textarea:focus-visible,.hot:focus-visible{outline:4px solid var(--ink);outline-offset:3px}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}

.app{min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;
background:radial-gradient(1200px 520px at 85% -10%,#FFE08A 0%,rgba(255,224,138,0) 62%),linear-gradient(180deg,#FFF2CC 0%,#FFF8E6 45%,#FDEFD0 100%)}
.top{display:flex;align-items:center;gap:8px;padding:max(10px,env(safe-area-inset-top)) max(16px,env(safe-area-inset-right)) 8px max(16px,env(safe-area-inset-left));max-width:1180px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;flex:1;min-width:0}
.brandmark{width:44px;height:44px;flex:none}
.brandname{font-size:20px;line-height:1.05}
.brandsub{font-size:13px;color:var(--muted);font-weight:700}
.tool{min-height:44px;min-width:44px;padding:0 14px;display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:999px;border:2px solid var(--line);background:var(--card);color:var(--ink);font-size:16px;font-weight:600}
.tool.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.starchip{min-height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;border-radius:999px;background:#FFF0CF;border:2px solid var(--gold-deep);font-family:'Fredoka',sans-serif;font-size:18px;font-weight:600;color:#5E4300}
.starchip .ico{fill:#FFC857;stroke:#E9A93A;stroke-width:1.6;width:22px;height:22px}
.ico{width:24px;height:24px;fill:none;stroke:currentColor;stroke-width:2.4;stroke-linecap:round;stroke-linejoin:round;flex:none}

.prog{display:flex;gap:6px;padding:0 max(16px,env(safe-area-inset-right)) 0 max(16px,env(safe-area-inset-left));max-width:1180px;width:100%;margin:0 auto}
.seg{flex:1;min-width:0;min-height:44px;background:none;border:0;padding:6px 0 0;display:flex;flex-direction:column;align-items:stretch;gap:6px;color:var(--muted);font-size:12px;font-weight:700}
.segbar{display:block;height:10px;border-radius:99px;background:#EBD9A8}
.seg.done .segbar{background:var(--leaf)}
.seg.now .segbar{background:var(--hood)}
.seg.now{color:var(--ink)}
.segname{display:block;text-align:center;line-height:1}

.stage{flex:1;width:100%;max-width:1180px;margin:0 auto;padding:12px max(16px,env(safe-area-inset-right)) 28px max(16px,env(safe-area-inset-left));outline:none}
.split{display:grid;grid-template-columns:minmax(0,1fr);gap:16px;align-items:stretch}
.card{background:var(--card);border:3px solid var(--gold);border-radius:28px;box-shadow:0 6px 0 var(--gold-deep)}
.visual{position:relative;overflow:hidden;background:var(--sky)}
.scene{background:var(--skyc,#BDE8F5);height:clamp(270px,45vh,580px);height:clamp(270px,45dvh,580px)}
.fill{position:absolute;inset:0;width:100%;height:100%;display:block}
.panel{padding:22px;display:flex;flex-direction:column;gap:14px;justify-content:center}
.panel>*{flex-shrink:0}
@media (min-width:1500px){.top,.prog,.stage,.footin{max-width:1360px}}
.eyerow{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.eyebrow{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-size:14px;font-weight:600;letter-spacing:.8px;text-transform:uppercase;color:var(--hood)}
.title{font-size:30px;line-height:1.12}
.bigtitle{font-size:clamp(34px,4vw,54px);line-height:1;overflow-wrap:break-word}
.split>*{min-width:0}
.storytext{font-size:22px;line-height:1.5;font-weight:700}
.lead{font-size:19px;line-height:1.5;font-weight:700}
.hint{font-size:16px;line-height:1.5;color:var(--muted);font-weight:700}
.lab{font-family:'Fredoka','Nunito',system-ui,sans-serif;font-size:18px;font-weight:600}
.row{display:flex;align-items:center;gap:12px;flex-wrap:wrap}
.dots{display:flex;gap:8px}
.dot{width:12px;height:12px;border-radius:50%;background:#EBD9A8;display:block}
.dot.on{background:var(--hood)}
.pill{display:inline-flex;padding:6px 14px;border-radius:99px;background:#FFF0CF;border:2px solid var(--gold-deep);font-weight:800;font-size:14px;color:#5E4300}
.tag{display:inline-block;align-self:flex-start;padding:4px 12px;border-radius:99px;background:#FFF0CF;border:2px solid var(--gold-deep);font-size:13px;font-weight:800;color:#5E4300}

.btn{min-height:52px;padding:0 24px;border-radius:999px;border:0;background:var(--hood);color:#fff;font-size:19px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:10px;box-shadow:0 5px 0 var(--hood-deep)}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 var(--hood-deep)}
.btn.alt{background:var(--card);color:var(--ink);border:3px solid var(--line);box-shadow:0 5px 0 var(--line)}
.btn.good{background:var(--leaf);box-shadow:0 5px 0 var(--leaf-deep)}
.btn:disabled{opacity:.45;cursor:default;transform:none}
.capbtn{min-height:44px;padding:0 14px;display:inline-flex;align-items:center;gap:8px;border-radius:999px;border:2px solid var(--gold-deep);background:#FFF0CF;color:#5E4300;font-size:15px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:10px}
.chip{min-height:48px;padding:0 18px;border-radius:999px;border:3px solid var(--line);background:#fff;color:var(--ink);font-size:17px;font-weight:600}
.chip.on{background:var(--leaf);border-color:var(--leaf);color:#fff}

.foot{position:sticky;bottom:0;background:rgba(255,248,230,.95);border-top:3px solid var(--gold);z-index:5;padding-bottom:env(safe-area-inset-bottom)}
.footin{max-width:1180px;margin:0 auto;padding:10px max(16px,env(safe-area-inset-right)) 10px max(16px,env(safe-area-inset-left));display:flex;align-items:center;gap:12px}
.footmid{flex:1;text-align:center;font-size:14px;font-weight:800;color:var(--muted)}


/* arte */
.ol{stroke:#5B2E25;stroke-width:2.4;stroke-linejoin:round;stroke-linecap:round}
.ol1{stroke:#5B2E25;stroke-width:1.5;stroke-linejoin:round;stroke-linecap:round}
.ols{fill:none;stroke:#5B2E25;stroke-opacity:.45;stroke-width:1.8;stroke-linecap:round}
.brow{fill:none;stroke:#8A5A2B;stroke-width:3;stroke-linecap:round}
.lash{fill:none;stroke:#1B1830;stroke-width:2.2;stroke-linecap:round}
.drift{animation:driftx 38s ease-in-out infinite alternate}
@keyframes driftx{from{transform:translateX(-14px)}to{transform:translateX(26px)}}
.smoke{animation:smoke 4s ease-in-out infinite}
@keyframes smoke{0%{opacity:.9;transform:translateY(0)}100%{opacity:.05;transform:translateY(-18px)}}
.tw{animation:tw 3.2s ease-in-out infinite}
@keyframes tw{0%,100%{opacity:.2}50%{opacity:1}}
.flap{transform-box:fill-box;transform-origin:50% 60%;animation:flap .5s ease-in-out infinite alternate}
@keyframes flap{from{transform:scaleX(1)}to{transform:scaleX(.45)}}
.swoosh{fill:none;stroke:#fff;stroke-width:5;stroke-linecap:round;stroke-dasharray:46 34;animation:swoosh 1.6s linear infinite;opacity:.85}
@keyframes swoosh{to{stroke-dashoffset:-160}}
.heart{transform-box:fill-box;transform-origin:center;animation:rise 3s ease-in infinite}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}20%{opacity:1}100%{transform:translateY(-80px) scale(1.1);opacity:0}}
.leafy{transform-box:fill-box;transform-origin:center;animation:sway 3.4s ease-in-out infinite alternate}
@keyframes sway{from{transform:rotate(-6deg)}to{transform:rotate(6deg)}}

/* narradora e desafios */
.coach{position:absolute;left:10px;right:10px;top:10px;display:flex;align-items:flex-start;gap:8px;z-index:3;pointer-events:none}
.coach>*{pointer-events:auto}
.coach.bottom{top:auto;bottom:10px;align-items:flex-end}
.coach.bottom .cbub::before{top:auto;bottom:16px}
.bird{width:50px;height:50px;flex:none;filter:drop-shadow(0 3px 0 rgba(43,37,64,.2));animation:hop 2.4s ease-in-out infinite}
@keyframes hop{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
.cbub{position:relative;background:#fff;border:3px solid var(--ink);border-radius:20px;padding:8px 12px 6px;max-width:min(100%,560px);box-shadow:0 4px 0 rgba(43,37,64,.18)}
.cbub::before{content:"";position:absolute;left:-11px;top:16px;border:8px solid transparent;border-right:8px solid var(--ink);border-left:0}
.cbub p{font-size:17px;font-weight:800;line-height:1.3}
.cbub.ok{background:#E4F4DE;border-color:var(--leaf)}
.cbub.warn{background:#FFF0CF;border-color:var(--gold-deep)}
.crow{display:flex;align-items:center;gap:8px;margin-top:4px}
.ccount{font-family:'Fredoka',sans-serif;font-weight:600;font-size:15px;color:var(--muted);margin-right:auto}
.mini{min-height:44px;min-width:44px;border-radius:99px;border:2px solid var(--line);background:#fff;color:var(--ink);display:inline-flex;align-items:center;justify-content:center;font-size:14px;font-weight:600;padding:0 10px}
.mini .ico{width:20px;height:20px}
.hot{cursor:pointer;outline:none;-webkit-tap-highlight-color:transparent}
.hot .halo{fill:rgba(255,255,255,.28);stroke:#fff;stroke-width:5;stroke-dasharray:8 8;transform-box:fill-box;transform-origin:center;animation:hotpulse 1.6s ease-in-out infinite}
.hot:focus-visible .halo{stroke:#2B2540;stroke-width:6}
.hot.done{pointer-events:none}
.hot.done .halo{display:none}
@keyframes hotpulse{0%,100%{transform:scale(1);opacity:.95}50%{transform:scale(1.12);opacity:.55}}
.shake{animation:shake .45s}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-10px)}75%{transform:translateX(10px)}}
.blink{transform-box:fill-box;transform-origin:center;animation:blink 3.4s infinite}
@keyframes blink{0%,92%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
.sgn{font-family:'Fredoka',sans-serif;font-weight:600;font-size:26px;text-anchor:middle;fill:#fff}
.sgn.dk{fill:#2B2540}
.snow{fill:none;stroke:#2B8FB8;stroke-width:4;stroke-linecap:round;transform-box:fill-box;transform-origin:center;animation:snowpop 1.5s ease-out forwards}
@keyframes snowpop{0%{transform:scale(.2) rotate(0);opacity:0}25%{opacity:1}100%{transform:scale(1.3) rotate(120deg);opacity:0}}
.shout-t{font-family:'Fredoka',sans-serif;font-weight:700;fill:#C9362B;stroke:#fff;stroke-width:7;paint-order:stroke;text-anchor:middle;transform-box:fill-box;transform-origin:center;animation:shoutpop 1s ease-out forwards}
@keyframes shoutpop{0%{transform:scale(.3);opacity:0}25%{opacity:1;transform:scale(1.1)}100%{transform:translateY(-34px) scale(1.25);opacity:0}}
.shout{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.shout .btn{font-size:24px;min-height:60px;padding:0 34px}
.meter{display:flex;gap:8px}
.mdot{width:22px;height:22px;border-radius:50%;background:#fff;border:3px solid var(--ink)}
.mdot.on{background:var(--hood)}

.map{display:flex;align-items:flex-start;gap:0;margin:2px 0 4px}
.stop{display:flex;flex-direction:column;align-items:center;gap:4px;flex:none;width:64px}
.pin{width:26px;height:26px;border-radius:50%;background:#EBD9A8;border:3px solid var(--line);display:block}
.stop.past .pin{background:var(--leaf);border-color:var(--leaf)}
.stop.here .pin{background:var(--hood);border-color:var(--hood-deep);box-shadow:0 0 0 5px rgba(201,54,43,.25)}
.sn{font-size:12px;font-weight:800;color:var(--muted);line-height:1}
.stop.here .sn{color:var(--ink)}
.road{flex:1;border-top:4px dotted #CFA84F;margin-top:11px;min-width:12px}

/* fx */
#fx{position:fixed;inset:0;pointer-events:none;z-index:80;overflow:hidden}
.toast{position:absolute;left:50%;top:38%;transform:translate(-50%,-50%);display:flex;align-items:center;gap:12px;background:#fff;border:4px solid var(--gold-deep);border-radius:99px;padding:10px 24px 10px 14px;box-shadow:0 8px 0 rgba(43,37,64,.2);font-family:'Fredoka',sans-serif;font-size:30px;font-weight:600;animation:toastin 1.9s ease forwards;white-space:nowrap}
.toast svg{width:44px;height:44px;fill:#FFC857;stroke:#E9A93A;stroke-width:1.6;stroke-linejoin:round;animation:spin 1.2s ease-out}
@keyframes toastin{0%{transform:translate(-50%,-30%) scale(.5);opacity:0}15%{transform:translate(-50%,-50%) scale(1.08);opacity:1}25%{transform:translate(-50%,-50%) scale(1)}80%{opacity:1}100%{transform:translate(-50%,-80%) scale(1);opacity:0}}
@keyframes spin{from{transform:rotate(-200deg) scale(.3)}to{transform:rotate(0) scale(1)}}
.conf{position:absolute;top:-16px;width:10px;height:14px;border-radius:2px;animation:fall 1.9s ease-in forwards}
@keyframes fall{from{transform:translate3d(0,0,0) rotate(0)}to{transform:translate3d(var(--dx),108vh,0) rotate(600deg)}}

/* quiz */
.opts{display:flex;flex-direction:column;gap:10px}
.opt{display:flex;align-items:center;gap:14px;text-align:left;width:100%;min-height:60px;padding:10px 16px;border-radius:20px;border:3px solid var(--line);background:#fff;color:var(--ink);font-family:'Nunito',system-ui,sans-serif;font-size:19px;font-weight:700;line-height:1.3}
.opt .let{flex:none;width:36px;height:36px;border-radius:50%;background:var(--paper);border:2px solid var(--line);display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:18px}
.opt.sel{border-color:var(--ink);background:#FFF3C4}
.opt.sel .let{background:var(--ink);color:#fff;border-color:var(--ink)}
.opt.goodsel{border-color:var(--leaf);background:#E4F4DE}
.opt.goodsel .let{background:var(--leaf);color:#fff;border-color:var(--leaf)}
.fb{border-radius:20px;padding:14px 16px;display:flex;gap:12px;align-items:flex-start;background:#E4F4DE;border:3px solid var(--leaf);font-size:18px;font-weight:700;line-height:1.45}
.fb.think{background:#FFF0CF;border-color:var(--gold-deep)}
.fb .ico{margin-top:2px}
#qfb{scroll-margin-bottom:110px}

.bubble{position:absolute;top:7%;left:7%;right:7%;padding:16px 20px;background:#fff;border:4px solid var(--ink);border-radius:36px;text-align:center;z-index:2}
.bubbletext{font-family:'Fredoka',sans-serif;font-size:clamp(20px,5vw,28px);font-weight:600;line-height:1.2}
.tail{position:absolute;background:#fff;border:4px solid var(--ink);border-radius:50%}
.t1{width:22px;height:22px;bottom:-34px;left:46%}
.t2{width:12px;height:12px;bottom:-52px;left:44%}

.bodyvis{display:flex;align-items:center;justify-content:center;padding:20px;background:linear-gradient(180deg,#DFF3F8,#BDE8F5)}
.bodymap{position:relative;width:min(240px,56vw,34vh);width:min(240px,56vw,34dvh);aspect-ratio:1/2}
.bodymap svg{position:absolute;inset:0;width:100%;height:100%}
.limbk{fill:none;stroke:#4FA3A5;stroke-width:22;stroke-linecap:round}
.zone{position:absolute;transform:translate(-50%,-50%);width:64px;height:64px;border-radius:50%;border:3px dashed var(--ink);background:rgba(255,255,255,.72);display:flex;align-items:center;justify-content:center;color:var(--ink);padding:0;font-size:14px;font-weight:600;line-height:1.1;animation:pulse 2s ease-in-out infinite}
.zone.on{background:var(--hood);border-style:solid;border-color:#fff;color:#fff;animation:none}
@keyframes pulse{0%,100%{transform:translate(-50%,-50%) scale(1)}50%{transform:translate(-50%,-50%) scale(1.1)}}

.fearvis{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px;padding:20px;background:linear-gradient(180deg,#FFF3C4,#FFE08A)}
.fearwrap{height:230px;display:flex;align-items:center;justify-content:center}
.fear{border-radius:50%;transition:width .25s,height .25s,background .25s;box-shadow:inset -10px -12px 0 rgba(43,37,64,.14)}
.slider{width:100%;height:44px;accent-color:var(--hood)}
.readout{font-family:'Fredoka',sans-serif;font-size:28px;font-weight:600;text-align:center}

.helpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,250px),1fr));gap:12px}
.helpcard{display:flex;align-items:center;gap:14px;text-align:left;min-height:72px;padding:12px 16px;border-radius:22px;border:3px solid var(--line);background:#fff;color:var(--ink);font-size:18px;font-weight:600;line-height:1.25}
.helpcard .hic{flex:none;width:44px;height:44px;border-radius:50%;background:#FFF0CF;display:flex;align-items:center;justify-content:center}
.helpcard.on{background:var(--leaf);border-color:var(--leaf);color:#fff}
.helpcard.on .hic{background:rgba(255,255,255,.2)}

.breathbox{position:relative;display:flex;align-items:center;justify-content:center;min-height:360px;background:radial-gradient(circle at 50% 40%,#E6F6FA 0%,#BDE8F5 72%)}
.orb{width:min(230px,56vw);height:min(230px,56vw);border-radius:50%;display:flex;align-items:center;justify-content:center;margin-bottom:56px;transition:transform .25s linear,background .6s ease;box-shadow:0 0 0 14px rgba(255,255,255,.5),0 0 0 30px rgba(255,255,255,.28)}
.orbicon{width:58%;height:58%}
.handle{fill:none;stroke:#7A4A22;stroke-width:6;stroke-linecap:round}
.orbtext{position:absolute;left:0;right:0;bottom:16px;text-align:center}
.orbword{font-family:'Fredoka',sans-serif;font-size:36px;font-weight:600;line-height:1.1}
.orbcount{font-size:22px;font-weight:800;color:var(--muted);min-height:28px}
.cdots{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.cdot{width:18px;height:18px;border-radius:50%;background:#EBD9A8;display:block}
.cdot.on{background:var(--hood)}
.cdot.done{background:var(--leaf)}
.infobox{background:#FFF0CF;border:3px solid var(--gold-deep);border-radius:20px;padding:14px 16px;font-size:19px;font-weight:700;line-height:1.45}

.posebox{background:linear-gradient(180deg,#8FD3F0,#E3F5F6)}
.limb{fill:none;stroke:#2B2540;stroke-width:9;stroke-linecap:round;stroke-linejoin:round}
.torso{fill:none;stroke:#C9362B;stroke-width:26;stroke-linecap:round}
.face-line{fill:none;stroke:#2B2540;stroke-width:2.5;stroke-linecap:round}
.arrowline{fill:none;stroke:#1F5C3B;stroke-width:5;stroke-linecap:round;stroke-dasharray:2 10}
.glass{fill:rgba(255,255,255,.35);stroke:#2B2540;stroke-width:2}
.win{fill:none;stroke:#8A5A3C;stroke-width:3}
.streak{fill:none;stroke:#fff;stroke-width:4;stroke-linecap:round;opacity:.6}
.ringwrap{position:relative;width:110px;height:110px;flex:none}
.ring{width:110px;height:110px;transform:rotate(-90deg)}
.ringbg{fill:none;stroke:#EBD9A8;stroke-width:10}
.ringfg{fill:none;stroke:var(--hood);stroke-width:10;stroke-linecap:round;stroke-dasharray:276.46;transition:stroke-dashoffset .25s linear}
.ringnum{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:36px;font-weight:600}
.pstep{min-height:40px;padding:0 14px;border-radius:99px;border:3px solid var(--line);background:#fff;display:inline-flex;align-items:center;font-size:15px;font-weight:800;color:var(--muted)}
.pstep.on{border-color:var(--hood);color:var(--ink);background:#FFE9E5}
.pstep.done{background:var(--leaf);border-color:var(--leaf);color:#fff}

.stagebox{background:#CFE9C9;display:flex;align-items:flex-end;transition:background .3s}
.stagesvg{width:100%;height:auto;display:block;aspect-ratio:8/5}
.off{display:none}
.ta{width:100%;min-height:120px;border-radius:20px;border:3px solid var(--line);padding:14px 16px;font-family:'Nunito',system-ui,sans-serif;font-size:19px;font-weight:700;color:var(--ink);background:#fff;resize:vertical;line-height:1.4}

.pfhead{display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.avatar{width:56px;height:56px;border-radius:50%;background:var(--hood);color:#fff;display:flex;align-items:center;justify-content:center;font-family:'Fredoka',sans-serif;font-size:26px;font-weight:600;flex:none}
.stars{display:flex;gap:4px}
.star{width:38px;height:38px;fill:#E8DDB9;stroke:#CDB77A;stroke-width:1.5;stroke-linejoin:round}
.star.on{fill:#FFC857;stroke:#E9A93A}
.pfitem{display:flex;flex-direction:column;gap:6px;padding:14px 16px;border-radius:20px;background:#fff;border:3px solid var(--line)}
.pftop{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.pftitle{font-family:'Fredoka',sans-serif;font-size:19px;font-weight:600}
.stt{display:inline-flex;align-items:center;gap:6px;padding:3px 12px;border-radius:99px;font-size:13px;font-weight:800;background:#EFE6CF;color:#4A4260}
.stt.done{background:var(--leaf);color:#fff}
.stt.mid{background:#FFE08A;color:#5E4300}
.stt .ico{width:16px;height:16px}
.pfline{font-size:16px;font-weight:700;line-height:1.4}
.rosterrow{display:flex;flex-direction:column;gap:6px}
.bar{height:14px;border-radius:99px;background:#EBD9A8;overflow:hidden}
.barfill{height:14px;border-radius:99px;background:var(--leaf);display:block}
.barfill.me{background:var(--hood)}

.scrim{position:fixed;inset:0;background:rgba(43,37,64,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:60}
.scrim[hidden]{display:none}
.sheet{max-width:560px;width:100%;max-height:88vh;max-height:88dvh;overflow:auto;padding:24px;display:flex;flex-direction:column;gap:14px}

/* ===== responsivo ===== */
@media (min-width:960px){
.split.two{grid-template-columns:minmax(0,1.2fr) minmax(0,1fr);gap:20px}
.split.two:has(.scene){grid-template-columns:minmax(0,1.55fr) minmax(0,1fr)}
.scene{height:auto;min-height:0;aspect-ratio:8/5;align-self:center}
.panel{padding:28px}
.storytext{font-size:24px}
}
@media (min-width:700px) and (max-width:959px){
.panel{padding:26px}
.storytext{font-size:24px}
.title{font-size:34px}
}
@media (max-width:640px){
.title{font-size:25px}
.storytext{font-size:20px}
.lead{font-size:18px}
.panel{padding:18px}
.brandname{font-size:16px}
.brandsub{display:none}
.lbl{display:none}
.tool{padding:0 10px}
.starchip{padding:0 10px}
.btn{padding:0 18px;font-size:18px}
.cbub p{font-size:16px}
.bird{width:42px;height:42px}
.breathbox,.posebox{min-height:310px}
.toast{font-size:24px}
.stop{width:56px}
}
@media (max-width:520px){
.brand>div{display:none}
.brand{flex:1}
}
@media (max-width:640px) and (orientation:portrait){
.cbub{display:flex;align-items:center;gap:8px;padding:6px 8px 6px 12px}
.cbub p{flex:1;font-size:15px;line-height:1.25}
.crow{flex-direction:column;align-items:flex-end;gap:2px;margin:0}
.ccount{margin:0;font-size:13px}
.crow [data-act="speakc"]{display:none}
}
@media (max-width:420px){
.fm1{display:none}
.cbub p{font-size:15px}
}
@media (max-width:340px){
.prog{gap:3px}
}
@media (max-width:380px){
.btn{padding:0 14px;font-size:17px}
.segname{font-size:11px}
.cbub p{font-size:15px}
}
@media (orientation:landscape) and (max-height:540px){
.top{padding-top:6px;padding-bottom:4px}
.brandsub,.lbl{display:none}
.seg{min-height:44px;padding-top:6px}
.stop{width:48px}
.sn{font-size:11px}
.segname{display:none}
.stage{padding-top:6px;padding-bottom:12px}
.split{grid-template-columns:minmax(0,1.15fr) minmax(0,1fr);gap:14px}
.scene{height:calc(100vh - 156px);height:calc(100dvh - 156px);min-height:200px}
.split>.panel{max-height:calc(100vh - 156px);max-height:calc(100dvh - 156px);overflow:auto}
.footin{padding-top:6px;padding-bottom:6px}
.btn{min-height:46px}
.breathbox,.posebox{min-height:0}
.bodymap{width:min(150px,30vh);width:min(150px,30dvh)}
.coach{top:6px;left:6px;right:6px}
.coach.bottom{top:auto;bottom:6px;right:auto;max-width:44%;align-items:flex-end}

.bird{display:none}
.cbub{padding:6px 10px 4px}
.cbub::before{display:none}
.cbub p{font-size:14px;line-height:1.25}
.crow{margin-top:2px}
.mini{min-height:44px;min-width:44px}
.storytext{font-size:18px}
.title{font-size:22px}
.lead{font-size:16px}
.panel{padding:14px;gap:10px}
.bigtitle{font-size:34px}
}
@media (prefers-reduced-motion:reduce){
*{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>

function stopSpeech() { try { if (window.speechSynthesis) { window.speechSynthesis.cancel(); } } catch (e) { /* sem narração */ } state.speaking = false; updateSpeak(); }
function speakText(t) {
  try {
    const ss = window.speechSynthesis;
    if (!ss || !t) { return; }
    if (state.speaking) { stopSpeech(); return; }
    ss.cancel();
    const u = new SpeechSynthesisUtterance(t);
    u.lang = 'pt-BR'; u.rate = 0.92;
    const v = (ss.getVoices ? ss.getVoices() : []).find((x) => /pt[-_]BR/i.test(x.lang));
    if (v) { u.voice = v; }
    u.onend = () => { state.speaking = false; updateSpeak(); };
    u.onerror = () => { state.speaking = false; updateSpeak(); };
    state.speaking = true; updateSpeak(); ss.speak(u);
  } catch (e) { state.speaking = false; updateSpeak(); }
}
function updateSpeak() { const b = $('#bSpeak'); if (!b) { return; } b.classList.toggle('on', state.speaking); $('#speakLbl').textContent = state.speaking ? 'Parar' : 'Ouvir'; b.setAttribute('aria-label', state.speaking ? 'Parar a narração' : 'Ouvir a narração'); }

    roster.map((r) => '<div class="rosterrow"><div class="pftop"><span class="pftitle">' + r.name + '</span><span class="hint">' + r.note + '</span></div><div class="bar"><span class="barfill ' + r.cls + '" style="width:' + r.pct + '%"></span></div></div>').join('') +
    '<div class="infobox">Em produção, cada ação fica salva no banco de dados: quem fez, quando e o que respondeu. A família vê só a própria criança; a escola vê só a própria turma.</div></div></div>';
};

/* ---------- mounts (estado persistido ao voltar numa tela) ---------- */
const MOUNT = {};
function markDone(el) { if (el) { el.classList.add('done'); } }

MOUNT.s1 = () => {
  $$('[data-act="treat"]').forEach((el) => { if (state.treats[Number(el.dataset.v)]) { el.parentNode.style.display = 'none'; } });
  if (state.done.s1) { setCoach(STORY.s1.ok, 'ok'); setCount('Completo'); $('[data-act="skip"]').hidden = true; }
  else { setCoach(STORY.s1.prompt); setCount(state.treats.filter(Boolean).length + '/3'); }
};
MOUNT.s2 = () => {
  if (state.done.s2) { $('#chapMove').style.transform = 'translate(250px,-6px)'; setCoach(STORY.s2.ok, 'ok'); setCount('Completo'); $('[data-act="skip"]').hidden = true; }
  else { setCoach(STORY.s2.prompt); }
};
MOUNT.s3 = () => {
  if (state.done.s3) { $('#wolfPop').style.opacity = 1; $('#wolfBushW').style.transform = 'translate(90px,0)'; $('#wolfBushW .blink').style.display = 'none'; $$('[data-act="bush"]').forEach(markDone); setCoach(STORY.s3.ok, 'ok'); setCount('Completo'); $('[data-act="skip"]').hidden = true; }
  else { setCoach(STORY.s3.prompt); }
};
MOUNT.s4 = () => {
  if (state.done.s4) { markDone($('[data-act="belly"]')); setCoach(STORY.s4.ok, 'ok'); setCount('Completo'); $('[data-act="skip"]').hidden = true; }
  else { setCoach(STORY.s4.prompt); }
};
MOUNT.s5 = () => {
  const ids = ['olhos', 'orelhas', 'boca'];
  ids.forEach((f, i) => { if (state.s5 > i) { markDone($('[data-act="feat"][data-v="' + f + '"]')); } });
  if (state.done.s5) { setCoach(STORY.s5.ok, 'ok'); setCount('Completo'); $('[data-act="skip"]').hidden = true; }
  else { setCoach(FEATS[state.s5].q); setCount(state.s5 + '/3'); }
};
MOUNT.s6 = () => {
  const dots = $$('.mdot');
  dots.forEach((d, i) => d.classList.toggle('on', i < state.shouts));
  if (state.done.s6) {
    $('#hunterW').style.opacity = 1; $('#vovoW').style.opacity = 1; $('#wolfW').style.display = 'none';
    $('#shoutBtn').disabled = true; setCoach(STORY.s6.ok, 'ok'); setCount('Completo'); $('[data-act="skip"]').hidden = true;
  } else { setCoach(STORY.s6.prompt); setCount(state.shouts + '/3'); }
};
MOUNT.quiz = () => refreshQuiz();
MOUNT.body = () => refreshBody();
MOUNT.fear = () => { refreshFear(); };
MOUNT.helps = () => refreshHelps();
MOUNT.breath = () => updateBreath(true);
MOUNT.stretch = () => updateStretch(true);
MOUNT.create = () => { $('#ending').value = state.ending; refreshCreate(); };

/* ---------- refresh ---------- */
function refreshQuiz() {
  $$('.opt').forEach((b, i) => { const sel = state.quiz === i; b.className = 'opt' + (sel ? (QUIZ[i].good ? ' goodsel' : ' sel') : ''); b.setAttribute('aria-pressed', String(sel)); });
  const fb = $('#qfb');
  if (state.quiz === null) { fb.innerHTML = '<p class="hint">Escolha uma alternativa para ver o retorno. Não existe resposta que reprova.</p>'; return; }
  const o = QUIZ[state.quiz];
  fb.innerHTML = '<div class="fb' + (o.good ? '' : ' think') + '">' + ic(o.good ? 'check' : 'info') + '<span>' + o.fb + '</span></div>';
  fb.scrollIntoView({ behavior: REDUCED ? 'auto' : 'smooth', block: 'nearest' });
}
function refreshBody() {
  $$('[data-act="zone"]').forEach((b) => { const on = state.body.includes(b.dataset.v); b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
  const names = BODY_LIST.filter((z) => state.body.includes(z.id)).map((z) => z.name);
  $('#bodySum').textContent = names.length ? 'Você marcou: ' + names.join(', ') + '.' : 'Toque no corpo ou nos botões para marcar. Pode marcar quantos lugares quiser.';
}
function fearInfo(f) {
  const mix = (a, b) => Math.round(a + (b - a) * f / 10);
  return { px: 70 + f * 14, bg: 'rgb(' + mix(255, 201) + ',' + mix(200, 54) + ',' + mix(87, 43) + ')', word: f <= 1 ? 'Quase nada' : f <= 3 ? 'Pequeno' : f <= 6 ? 'Médio' : f <= 8 ? 'Grande' : 'Enorme' };
}
function refreshFear() {
  const i = fearInfo(state.fear); const b = $('#fearBall');
  b.style.width = i.px + 'px'; b.style.height = i.px + 'px'; b.style.background = i.bg;
  $('#fearOut').textContent = state.fear + ' de 10 · ' + i.word;
}
function refreshHelps() {
  $$('.helpcard').forEach((b) => { const on = state.helps.includes(b.dataset.v); b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
  const n = state.helps.length;
  $('#helpSum').textContent = n ? 'Você escolheu ' + n + (n === 1 ? ' ferramenta' : ' ferramentas') + '. Que tal testar a respiração e o alongamento agora?' : 'Nenhuma ferramenta escolhida ainda. Toque nos cartões para escolher.';
}
const SKY = { floresta: '#CFE9C9', trilha: '#BDE8F5', casa: '#BDE8F5', rio: '#BDE8F5', flores: '#CDEBFF', noite: '#2B3A67' };
function refreshCreate() {
  $('.stagebox').style.background = SKY[state.scenery];
  SCENERIES.forEach((x) => $('#cb-' + x.id).classList.toggle('off', state.scenery !== x.id));
  CHARS.forEach((x) => $('#cc-' + x.id).classList.toggle('off', !state.chars[x.id]));
  $$('[data-act="scenery"]').forEach((b) => { const on = state.scenery === b.dataset.v; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
  $$('[data-act="char"]').forEach((b) => { const on = !!state.chars[b.dataset.v]; b.classList.toggle('on', on); b.setAttribute('aria-pressed', String(on)); });
}
let lastBWord = '';
function breathInfo() {
  const t = state.breathTk / 5; const done = state.breathTk >= BREATH_TICKS;
  if (done) { return { word: 'Muito bem!', scale: 0.8, count: '', instr: 'Você completou os 4 ciclos. Repare como o seu corpo está agora.', bg: '#9AD08B', done: true, cycles: 4 }; }
  if (state.breathTk === 0 && !state.breathRun) { return { word: 'Pronto?', scale: 0.55, count: '', instr: 'Sentado com as costas apoiadas? Quando quiser, toque em Começar.', bg: '#FFC857', done: false, cycles: 0 }; }
  const w = t % 12; const cycles = Math.floor(t / 12);
  if (w < 4) { return { word: 'Inspire', scale: 0.55 + 0.45 * (w / 4), count: Math.ceil(4 - w), instr: 'Pelo nariz, como quem cheira os doces da cesta.', bg: '#FFC857', done: false, cycles: cycles }; }
  if (w < 6) { return { word: 'Segure', scale: 1, count: Math.ceil(6 - w), instr: 'Segure o ar bem de levinho.', bg: '#9AD08B', done: false, cycles: cycles }; }
  return { word: 'Solte', scale: 1 - 0.45 * ((w - 6) / 6), count: Math.ceil(12 - w), instr: 'Pela boca, devagar, como quem sopra a sopa quente.', bg: '#8FD3EE', done: false, cycles: cycles };
}
function updateBreath(force) {
  const o = $('#orb'); if (!o) { return; }
  const b = breathInfo();
  o.style.transform = 'scale(' + b.scale.toFixed(3) + ')'; o.style.background = b.bg;
  $('#bword').textContent = b.word; $('#bcount').textContent = b.count; $('#binstr').textContent = b.instr;
  $$('.cdot').forEach((d, i) => { d.className = 'cdot' + (i < b.cycles ? ' done' : (i === b.cycles && !b.done && state.breathTk > 0 ? ' on' : '')); });
  $('#bcyc').textContent = 'Ciclo ' + Math.min(4, b.cycles + (b.done ? 0 : 1)) + ' de 4';
  $('#bToggle').innerHTML = ic(state.breathRun ? 'pause' : 'play') + (b.done ? 'Repetir' : state.breathRun ? 'Pausar' : (state.breathTk > 0 ? 'Continuar' : 'Começar'));
  $('#bAfter').hidden = !b.done;
  $$('[data-act="after"]').forEach((c) => { const on = state.after === c.dataset.v; c.classList.toggle('on', on); c.setAttribute('aria-pressed', String(on)); });
  if (b.word !== lastBWord || force) { lastBWord = b.word; say(b.word + '. ' + b.instr); }
  if (b.done && !state.breathStar) { state.breathStar = true; addStars(1); celebrate('Respiração completa!'); }
}
let lastPose = -1;
function updateStretch(force) {
  const box = $('#poseBox'); if (!box) { return; }
  const sk = state.stretchTk; const done = sk >= STRETCH_TICKS; const idx = Math.min(3, Math.floor(sk / 50)); const inn = sk % 50;
  if (!$('#rigHost')) { box.innerHTML = rigSVG(); rigStart(); }
  if (idx !== lastPose || force) { lastPose = idx; say(POSES[idx].n + '. ' + POSES[idx].d); }
  $('#sName').textContent = done ? 'Alongamento completo!' : POSES[idx].n;
  $('#sDesc').textContent = done ? 'Você percorreu a trilha inteira. Que tal sacudir as mãos e dar um sorriso?' : POSES[idx].d;
  $('#sCount').textContent = done ? '0' : String(Math.ceil((50 - inn) / 5));
  $('#sRing').style.strokeDashoffset = (276.46 * (done ? 1 : inn / 50)).toFixed(1);
  POSES.forEach((p, i) => { $('#ps' + i).className = 'pstep' + (sk >= (i + 1) * 50 ? ' done' : (i === idx && !done ? ' on' : '')); });
  $('#sToggle').innerHTML = ic(state.stretchRun ? 'pause' : 'play') + (done ? 'Repetir' : state.stretchRun ? 'Pausar' : (sk > 0 ? 'Continuar' : 'Começar'));
  $('#sSkip').hidden = done;
  if (done && !state.stretchStar) { state.stretchStar = true; addStars(1); celebrate('Alongamento completo!'); }
}

/* ---------- ações ---------- */
const ACTIONS = {
  start: () => go(1),
  guide: () => toggleGuide(),
  speakc: () => speakText(coachText),
  skip: () => { const id = STEPS[state.step]; state.done[id] = true; state.skipped[id] = true; if (id === 's5') { state.s5 = 3; } if (id === 's1') { state.treats = [true, true, true]; } if (id === 's6') { state.shouts = 3; } render(false); updateChrome(); },
  treat: (el, v) => {
    const i = Number(v); if (state.treats[i] || state.done.s1) { return; }
    state.treats[i] = true; el.classList.add('done');
    const x = Number(el.dataset.x); const dx = 568 - x, dy = 16;
    const a = anim(el.parentNode, [{ transform: 'translate(0px,0px) scale(1)' }, { transform: 'translate(' + (dx * 0.5) + 'px,' + (dy * 0.5 - 90) + 'px) scale(1.2)', offset: 0.5 }, { transform: 'translate(' + dx + 'px,' + dy + 'px) scale(.55)', opacity: 0.2 }], { duration: REDUCED ? 1 : 750, easing: 'ease-in-out' });
    const fin = () => { el.parentNode.style.display = 'none'; };
    if (a) { a.onfinish = fin; } else { fin(); }
    const n = state.treats.filter(Boolean).length; setCount(n + '/3');
    if (n < 3) { setCoach('Muito bem! Falta' + (3 - n === 1 ? ' 1 docinho' : 'm 2 docinhos') + '.', 'ok'); } else { setTimeout(() => complete('s1'), 700); }
  },
  sign: (el, v) => {
    if (state.done.s2) { return; }
    if (v === 'a') { state.tries.s2++; el.classList.remove('shake'); void el.getBoundingClientRect(); el.classList.add('shake'); setCoach('Hmm… o atalho é escuro! A mamãe disse: direto pela trilha. Tente a outra placa.', 'warn'); return; }
    $$('[data-act="sign"]').forEach(markDone);
    const a = anim($('#chapMove'), [{ transform: 'translate(0px,0px)' }, { transform: 'translate(125px,-14px)', offset: 0.5 }, { transform: 'translate(250px,-6px)' }], { duration: REDUCED ? 1 : 1500, easing: 'ease-in-out' });
    setCoach('Isso! Direto pela trilha da vovó. Vamos lá!', 'ok');
    if (a) { a.onfinish = () => complete('s2'); } else { complete('s2'); }
  },
  bush: (el, v) => {
    if (state.done.s3) { return; }
    if (v !== '2') { state.tries.s3++; el.classList.remove('shake'); void el.getBoundingClientRect(); el.classList.add('shake'); setCoach(state.tries.s3 % 2 ? 'Só tem folhinhas aqui! Procure os olhinhos amarelos.' : 'Hum, nada por aqui. Tente outro arbusto!', 'warn'); return; }
    $$('[data-act="bush"]').forEach(markDone);
    const w = $('#wolfPop'); w.style.opacity = 1;
    anim(w, [{ transform: 'translateY(30px) scale(.7)', opacity: 0 }, { transform: 'translateY(0) scale(1.06)', opacity: 1, offset: 0.7 }, { transform: 'translateY(0) scale(1)', opacity: 1 }], { duration: REDUCED ? 1 : 600, easing: 'ease-out' });
    anim($('#wolfBushW'), [{ transform: 'translate(0px,0px)' }, { transform: 'translate(90px,0px)' }], { duration: REDUCED ? 1 : 500 });
    $('#wolfBushW .blink').style.display = 'none';
    setTimeout(() => complete('s3'), 600);
  },
  belly: (el) => {
    if (state.done.s4) { return; }
    markDone(el);
    const g = $('#fx4'); let s = '';
    for (let i = 0; i < 7; i++) { const a = (i / 7) * Math.PI * 2; const x = 400 + Math.cos(a) * 80, y = 322 + Math.sin(a) * 56; s += '<path class="snow" style="animation-delay:' + (i * 0.08) + 's" transform="translate(' + x.toFixed(0) + ' ' + y.toFixed(0) + ')" d="M0 -12 V12 M-10 -6 L10 6 M-10 6 L10 -6"/>'; }
    g.innerHTML = s; setTimeout(() => { g.innerHTML = ''; }, 1700);
    setTimeout(() => complete('s4'), 500);
  },
  feat: (el, v) => {
    if (state.done.s5) { return; }
    const cur = FEATS[state.s5];
    if (v !== cur.id) { state.tries.s5++; el.classList.remove('shake'); void el.getBoundingClientRect(); el.classList.add('shake'); setCoach('Hmm, não é aí! Procure ' + cur.hint + '.', 'warn'); return; }
    markDone(el); state.s5++; setCount(state.s5 + '/3');
    if (state.s5 >= 3) { setCoach(cur.a + ' Essa não é a vovó… é o Lobo!', 'ok'); setTimeout(() => complete('s5'), 900); return; }
    setCoach(cur.a, 'ok');
    const n = state.s5;
    setTimeout(() => { if (STEPS[state.step] === 's5' && state.s5 === n) { setCoach(FEATS[n].q); } }, 1700);
  },
  shout: () => {
    if (state.done.s6 || state.shouts >= 3) { return; }
    state.shouts++; $$('.mdot').forEach((d, i) => d.classList.toggle('on', i < state.shouts)); setCount(state.shouts + '/3');
    $('#shoutFx').insertAdjacentHTML('beforeend', '<text class="shout-t" x="330" y="196" style="font-size:' + (26 + state.shouts * 12) + 'px">SOCORRO!</text>');
    setTimeout(() => { const t = $('#shoutFx text'); if (t) { t.remove(); } }, 1050);
    if (state.shouts < 3) { setCoach(state.shouts === 1 ? 'Mais alto! Grite de novo!' : 'Quase lá! Mais uma vez, com toda a força!', 'warn'); return; }
    $('#shoutBtn').disabled = true; setCoach('Alguém ouviu! O caçador está chegando…', 'ok');
    const h = $('#hunterW'); h.style.opacity = 1;
    anim(h, [{ transform: 'translateX(380px)' }, { transform: 'translateX(0px)' }], { duration: REDUCED ? 1 : 1400, easing: 'ease-out' });
    setTimeout(() => { anim($('#wolfW'), [{ transform: 'translateX(0px)', opacity: 1 }, { transform: 'translateX(-520px)', opacity: 0 }], { duration: REDUCED ? 1 : 900, easing: 'ease-in' }); }, REDUCED ? 1 : 900);
    setTimeout(() => { $('#vovoW').style.opacity = 1; anim($('#vovoW'), [{ opacity: 0 }, { opacity: 1 }], { duration: 400 }); complete('s6'); }, REDUCED ? 5 : 2100);
  },
  quiz: (el, v) => { state.quiz = Number(v); refreshQuiz(); },
  zone: (el, v) => { state.body = state.body.includes(v) ? state.body.filter((x) => x !== v) : state.body.concat(v); refreshBody(); },
  help: (el, v) => { state.helps = state.helps.includes(v) ? state.helps.filter((x) => x !== v) : state.helps.concat(v); refreshHelps(); },
  breathToggle: () => { if (state.breathTk >= BREATH_TICKS) { state.breathTk = 0; state.breathRun = true; state.after = null; state.breathStar = false; } else { state.breathRun = !state.breathRun; } updateBreath(true); },
  after: (el, v) => { state.after = v; updateBreath(); },
  stretchToggle: () => { if (state.stretchTk >= STRETCH_TICKS) { state.stretchTk = 0; state.stretchRun = true; state.stretchStar = false; } else { state.stretchRun = !state.stretchRun; } updateStretch(true); },
  stretchSkip: () => { const n = (Math.floor(state.stretchTk / 50) + 1) * 50; state.stretchTk = Math.min(n, STRETCH_TICKS); if (state.stretchTk >= STRETCH_TICKS) { state.stretchRun = false; } updateStretch(true); },
  scenery: (el, v) => { state.scenery = v; refreshCreate(); },
  char: (el, v) => { state.chars[v] = !state.chars[v]; refreshCreate(); }
};
stage.addEventListener('click', (e) => { const el = e.target.closest('[data-act]'); if (el && stage.contains(el) && ACTIONS[el.dataset.act]) { ACTIONS[el.dataset.act](el, el.dataset.v); } });
stage.addEventListener('keydown', (e) => {
  if (e.key !== 'Enter' && e.key !== ' ') { return; }
  const el = e.target.closest('.hot'); if (!el) { return; }
  e.preventDefault(); if (ACTIONS[el.dataset.act]) { ACTIONS[el.dataset.act](el, el.dataset.v); }
});
stage.addEventListener('input', (e) => {
  if (e.target.id === 'fearrange') { state.fear = Number(e.target.value); state.fearTouched = true; refreshFear(); }
  if (e.target.id === 'ending') { state.ending = e.target.value; }
});

/* ---------- shell ---------- */
function blocked() { const id = STEPS[state.step]; return !!STORY[id] && !state.done[id]; }
function updateChrome() {
  const step = state.step; const sec = SECTIONS.find((x) => step >= x.first && step <= x.last);
  $('#prog').innerHTML = SECTIONS.map((x) => '<button class="seg ' + (sec && sec.id === x.id ? 'now' : (step > x.last ? 'done' : '')) + '" data-go="' + x.first + '" aria-label="Ir para ' + x.name + '"><span class="segbar"></span><span class="segname">' + x.name + '</span></button>').join('');
  $('#bPrev').disabled = step === 0;
  const last = step === STEPS.length - 1;
  $('#nextLbl').textContent = step === 0 ? 'Começar' : last ? 'Recomeçar' : 'Continuar';
  $('#bNext').disabled = blocked();
  $('#bNext').title = blocked() ? 'Ajude a Chapeuzinho para continuar (ou toque em Pular)' : '';
  $('#footMid').innerHTML = step === 0 ? 'Capa' : '<span class="fm1">' + sec.name + ' · </span>' + (step - sec.first + 1) + ' de ' + (sec.last - sec.first + 1);
  $('#starN').textContent = state.stars;
}
function fitHot() {
  const MIN = 46, CAP = 2;
  $$('#stage .hot').forEach((g) => {
    Array.from(g.children).filter((c) => (c.getAttribute('fill') || '').indexOf('0.01') > -1).forEach((h) => {
      h.style.transform = '';
      const r = h.getBoundingClientRect(); if (!r.width || !r.height) { return; }
      const sx = Math.min(CAP, Math.max(1, MIN / r.width)), sy = Math.min(CAP, Math.max(1, MIN / r.height));
      if (sx > 1.02 || sy > 1.02) { h.style.transformBox = 'fill-box'; h.style.transformOrigin = g.dataset.grow === 'up' ? 'center 62%' : g.dataset.grow === 'down' ? 'center 30%' : 'center'; h.style.transform = 'scale(' + sx.toFixed(2) + ',' + sy.toFixed(2) + ')'; }
    });
  });
}
let fitTimer = 0;
window.addEventListener('resize', () => { clearTimeout(fitTimer); fitTimer = setTimeout(fitHot, 120); });
function render(scroll) {
  const id = STEPS[state.step];
  stage.innerHTML = VIEWS[id]();
  if (MOUNT[id]) { MOUNT[id](); }
  fitHot();
  if (scroll !== false) { window.scrollTo(0, 0); try { stage.focus({ preventScroll: true }); } catch (e) { /* ignora */ } }
}
function go(n) {
  stopSpeech(); state.breathRun = false; state.stretchRun = false; lastPose = -1; lastBWord = '';
  closeGuide();
  state.step = Math.max(0, Math.min(STEPS.length - 1, n)); state.max = Math.max(state.max, state.step);
  render(true); updateChrome();
}
function guideKey() { const id = STEPS[state.step]; return STORY[id] ? 'story' : id; }
function toggleGuide() { if (state.guide) { closeGuide(); } else { const g = GUIDE[guideKey()]; $('#guideTitle').textContent = g[0]; $('#guideBody').textContent = g[1]; $('#guide').hidden = false; state.guide = true; $('#bGuide').setAttribute('aria-pressed', 'true'); $('#bGuide').classList.add('on'); $('#guideClose').focus(); } }
function closeGuide() { state.guide = false; $('#guide').hidden = true; $('#bGuide').setAttribute('aria-pressed', 'false'); $('#bGuide').classList.remove('on'); }
function restart() { stopSpeech(); closeGuide(); state = fresh(); lastPose = -1; lastBWord = ''; render(true); updateChrome(); }

$('#bPrev').addEventListener('click', () => go(state.step - 1));
$('#bNext').addEventListener('click', () => { if (state.step === STEPS.length - 1) { restart(); } else { go(state.step + 1); } });
$('#bSpeak').addEventListener('click', () => speakText(currentText()));
$('#bGuide').addEventListener('click', toggleGuide);
$('#guideClose').addEventListener('click', closeGuide);
$('#bRestart').addEventListener('click', restart);
$('#prog').addEventListener('click', (e) => { const b = e.target.closest('[data-go]'); if (b) { go(Number(b.dataset.go)); } });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape' && state.guide) { closeGuide(); } });
if (!('speechSynthesis' in window)) { $('#bSpeak').hidden = true; }

setInterval(() => {
  let hit = false;
  if (state.breathRun) { state.breathTk = Math.min(state.breathTk + 1, BREATH_TICKS); if (state.breathTk >= BREATH_TICKS) { state.breathRun = false; } hit = true; if (STEPS[state.step] === 'breath') { updateBreath(); } }
  if (state.stretchRun) { state.stretchTk = Math.min(state.stretchTk + 1, STRETCH_TICKS); if (state.stretchTk >= STRETCH_TICKS) { state.stretchRun = false; } hit = true; if (STEPS[state.step] === 'stretch') { updateStretch(); } }
  return hit;
}, 200);

const startAt = STEPS.indexOf(location.hash.slice(1));
if (startAt > 0) { state.step = startAt; state.max = startAt; }
render(false); updateChrome();
})();
</script>
